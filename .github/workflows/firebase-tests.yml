name: Validar integração Firebase
on:
  push:
    branches: [main, feat/plataforma-estetica-bem-estar]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Testar isolamento e validação das regras
        run: npm run test:rules
      - name: Testar Authentication e Firestore no navegador
        run: npm run test:firebase
